
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | HOTANI ACRYLIC STORE</title>
    <link rel="stylesheet" href="../style.css">

    <style>
        .checkout-container {
            max-width: 1100px;
            margin: 45px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 1.3fr 0.7fr;
            gap: 35px;
        }

        .checkout-form,
        .order-summary {
            padding: 25px;
            border: 1px solid #eee;
            border-radius: 6px;
        }

        .checkout-form h2,
        .order-summary h2 {
            margin-top: 0;
            margin-bottom: 22px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
            font: inherit;
        }

        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }

        .place-order-button {
            width: 100%;
            padding: 15px;
            background: #222;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }

        .order-item {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }

        .order-total {
            font-size: 21px;
            font-weight: bold;
            margin-top: 20px;
        }

        @media(max-width:750px) {
            .checkout-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div id="announcement-bar">
        Welcome to HOTANI ACRYLIC STORE
    </div>

    <header style="padding:20px 4%;border-bottom:1px solid #eee;">
        <a href="../index.html" style="font-size:22px;font-weight:bold;">
            HOTANI ACRYLIC STORE
        </a>
        <a href="../index.html" style="float:right;">Home</a>
    </header>

    <nav style="padding:15px 4%;background:#f7f7f7;">
        <a href="../index.html">Home</a> /
        <a href="cart.html">Cart</a> / Checkout
    </nav>

    <main>
        <div class="checkout-container">

            <section class="checkout-form">
                <h2>Customer Details</h2>

                <form id="checkout-form">

                    <div class="form-group">
                        <label for="customer-name">Full Name *</label>
                        <input type="text" id="customer-name" required>
                    </div>

                    <div class="form-group">
                        <label for="customer-phone">Mobile Number *</label>
                        <input type="tel" id="customer-phone" placeholder="03XXXXXXXXX" required>
                    </div>

                    <div class="form-group">
                        <label for="customer-email">Email Address</label>
                        <input type="email" id="customer-email">
                    </div>

                    <div class="form-group">
                        <label for="customer-city">City *</label>
                        <input type="text" id="customer-city" required>
                    </div>

                    <div class="form-group">
                        <label for="customer-address">Complete Delivery Address *</label>
                        <textarea id="customer-address" required></textarea>
                    </div>

                    <div class="form-group">
                        <label for="customer-notes">Order Notes (Optional)</label>
                        <textarea id="customer-notes" placeholder="Any special instructions?"></textarea>
                    </div>

                    <button type="submit" class="place-order-button">
                        Place Order on WhatsApp
                    </button>

                </form>
            </section>

            <aside class="order-summary">
                <h2>Your Order</h2>

                <div id="checkout-items"></div>

                <div class="order-total" id="checkout-total">
                    Total: Rs. 0
                </div>

                <p style="font-size:13px;color:#666;margin-top:18px;">
                    Your order details will be sent to our WhatsApp for confirmation.
                </p>

                <a href="cart.html">← Back to Cart</a>
            </aside>

        </div>
    </main>

    <footer style="background:#222;color:white;padding:25px;text-align:center;">
        © 2026 HOTANI ACRYLIC STORE. All Rights Reserved.
    </footer>

    <script>
        const WHATSAPP_NUMBER = "";

        let cart = [];

        try {
            cart = JSON.parse(localStorage.getItem("hotani_cart")) || [];
        } catch (error) {
            cart = [];
        }

        const itemsContainer = document.getElementById("checkout-items");
        const totalContainer = document.getElementById("checkout-total");

        function formatPrice(price) {
            return "Rs. " + Number(price).toLocaleString("en-PK");
        }

        function displayOrder() {
            if (cart.length === 0) {
                itemsContainer.innerHTML = `
                    <p>Your cart is empty.</p>
                    <a href="../index.html">Continue Shopping</a>
                `;

                totalContainer.textContent = "Total: Rs. 0";
                document.querySelector(".place-order-button").disabled = true;
                return;
            }

            itemsContainer.innerHTML = cart.map(item => `
                <div class="order-item">
                    <span>
                        ${escapeHTML(item.name)} × ${Number(item.quantity)}
                    </span>
                    <strong>
                        ${formatPrice(Number(item.price) * Number(item.quantity))}
                    </strong>
                </div>
            `).join("");

            const total = cart.reduce(
                (sum, item) => sum + Number(item.price) * Number(item.quantity),
                0
            );

            totalContainer.textContent = "Total: " + formatPrice(total);
        }

        function escapeHTML(value) {
            return String(value).replace(/[&<>"']/g, char => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#039;"
            })[char]);
        }

        document.getElementById("checkout-form").addEventListener("submit", function(event) {
            event.preventDefault();

            if (cart.length === 0) {
                alert("Your cart is empty.");
                return;
            }

            if (!WHATSAPP_NUMBER) {
                alert("WhatsApp number abhi add nahi hua. Store ka WhatsApp number set karna baqi hai.");
                return;
            }

            const name = document.getElementById("customer-name").value.trim();
            const phone = document.getElementById("customer-phone").value.trim();
            const email = document.getElementById("customer-email").value.trim();
            const city = document.getElementById("customer-city").value.trim();
            const address = document.getElementById("customer-address").value.trim();
            const notes = document.getElementById("customer-notes").value.trim();

            let message = "Assalam-o-Alaikum! I want to place an order from HOTANI ACRYLIC STORE.\n\n";

            message += "CUSTOMER DETAILS\n";
            message += "Name: " + name + "\n";
            message += "Phone: " + phone + "\n";
            message += "Email: " + (email || "Not provided") + "\n";
            message += "City: " + city + "\n";
            message += "Address: " + address + "\n\n";

            message += "ORDER DETAILS\n";

            cart.forEach((item, index) => {
                message +=
                    (index + 1) + ". " + item.name + "\n" +
                    "Quantity: " + item.quantity + "\n" +
                    "Price: " + formatPrice(item.price * item.quantity) + "\n\n";
            });

            const total = cart.reduce(
                (sum, item) => sum + Number(item.price) * Number(item.quantity),
                0
            );

            message += "TOTAL: " + formatPrice(total) + "\n";

            if (notes) {
                message += "\nOrder Notes: " + notes;
            }

            message += "\n\nPlease confirm my order. Thank you!";

            const url =
                "https://wa.me/" +
                WHATSAPP_NUMBER.replace(/\D/g, "") +
                "?text=" +
                encodeURIComponent(message);

            window.open(url, "_blank");
        });

        displayOrder();
    </script>

</body>
</html>
