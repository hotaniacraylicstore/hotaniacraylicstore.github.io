
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | HOTANI ACRYLIC STORE</title>
    <link rel="stylesheet" href="../style.css">

    <style>
        .error-page {
            min-height: 75vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 25px;
        }

        .error-content h1 {
            font-size: 100px;
            margin: 0;
            line-height: 1.1;
        }

        .error-content h2 {
            font-size: 27px;
            margin: 15px 0;
        }

        .error-content p {
            color: #777;
            margin-bottom: 25px;
        }

        .home-button {
            display: inline-block;
            padding: 13px 28px;
            background: #111;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
        }

        .home-button:hover {
            background: #444;
        }

        @media (max-width: 600px) {
            .error-content h1 {
                font-size: 75px;
            }
        }
    </style>
</head>

<body>

    <main class="error-page">
        <div class="error-content">
            <h1>404</h1>
            <h2>Page Not Found</h2>
            <p>Sorry! The page you are looking for does not exist or has been moved.</p>
            <a href="../index.html" class="home-button">Back to Home</a>
        </div>
    </main>

</body>
</html>
