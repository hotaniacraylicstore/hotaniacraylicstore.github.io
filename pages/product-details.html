
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Details | HOTANI ACRYLIC STORE</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#fff;color:#222}
.topbar{background:#222;color:#fff;text-align:center;padding:10px;font-size:13px}
header{padding:18px 5%;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center;gap:15px}
header a{color:#222;text-decoration:none;font-weight:bold}
.brand{font-size:21px;letter-spacing:1px}
.container{max-width:1150px;margin:35px auto;padding:0 20px}
.breadcrumb{font-size:13px;color:#777;margin-bottom:25px}
.breadcrumb a{color:#555;text-decoration:none}
.product-layout{display:grid;grid-template-columns:1fr 1fr;gap:45px;align-items:start}
.product-image-box{background:#f7f7f7;border-radius:8px;overflow:hidden}
.product-image-box img{display:block;width:100%;height:auto;object-fit:contain}
.product-info h1{font-size:30px;line-height:1.3;margin:5px 0 18px}
.badge{display:inline-block;background:#222;color:white;padding:7px 12px;font-size:12px;margin-bottom:15px}
.prices{margin:15px 0}
.old-price{color:#999;text-decoration:line-through;font-size:18px;margin-right:10px}
.sale-price{font-size:27px;font-weight:bold;color:#222}
.description{color:#666;line-height:1.8;margin:22px 0;font-size:15px}
.calculator{border:1px solid #e5e5e5;border-radius:8px;padding:20px;margin:25px 0;background:#fafafa}
.calculator h3{margin:0 0 8px;font-size:20px}
.calculator-note{font-size:13px;color:#777;line-height:1.6;margin-bottom:18px}
.unit-options{display:flex;gap:10px;margin-bottom:18px}
.unit-options button{flex:1;padding:12px;border:1px solid #ccc;background:#fff;cursor:pointer;font-weight:bold;border-radius:4px}
.unit-options button.active{background:#222;color:#fff;border-color:#222}
.size-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.size-fields label{font-size:13px;font-weight:bold;display:block;margin-bottom:7px}
.size-fields input{width:100%;padding:13px;border:1px solid #ccc;border-radius:4px;font-size:16px}
.minimum-note{font-size:12px;color:#777;margin-top:12px}
.size-error{color:#c62828;font-size:13px;margin-top:10px;display:none}
.price-summary{border-top:1px solid #ddd;margin-top:18px;padding-top:15px}
.price-row{display:flex;justify-content:space-between;gap:10px;margin:9px 0;font-size:14px}
.total-row{font-size:19px;font-weight:bold;margin-top:15px}
.quantity-label{display:block;font-weight:bold;margin:20px 0 10px}
.quantity-control{display:flex;align-items:center;gap:15px;margin-bottom:22px}
.quantity-control button{width:38px;height:38px;border:1px solid #ddd;background:white;font-size:20px;cursor:pointer}
#quantity{font-size:17px;min-width:20px;text-align:center}
.action-button{display:block;width:100%;padding:16px;border:none;cursor:pointer;font-size:15px;font-weight:bold;margin-top:12px;border-radius:3px}
.add-button{background:#222;color:white}
.buy-button{background:#e8e8e8;color:#222}
.action-button:disabled{opacity:.5;cursor:not-allowed}
.details-box{border-top:1px solid #eee;margin-top:28px;padding-top:20px;line-height:1.9;color:#666;font-size:14px}
.error{text-align:center;padding:70px 20px}
footer{margin-top:60px;padding:25px;background:#222;color:white;text-align:center;font-size:13px}
@media(max-width:700px){
.product-layout{grid-template-columns:1fr;gap:25px}
.product-info h1{font-size:24px}
.container{margin-top:22px}
}
</style>
</head>

<body>

<div class="topbar">Welcome to HOTANI ACRYLIC STORE</div>

<header>
<a href="../index.html" class="brand">HOTANI ACRYLIC STORE</a>
<a href="../index.html">← Continue Shopping</a>
</header>

<main class="container">
<div class="breadcrumb">
<a href="../index.html">Home</a> / Product Details
</div>
<div id="product-details"><p>Loading product...</p></div>
</main>

<footer>© HOTANI ACRYLIC STORE. All Rights Reserved.</footer>

<script src="../data/products.js"></script>

<script src="../products/islamic-calligraphy/gold-acrylic-bismillah/product.js"></script>
<script src="../products/islamic-calligraphy/round-ayatul-kursi/product.js"></script>
<script src="../products/islamic-calligraphy/mashaallah-gold-acrylic/product.js"></script>
<script src="../products/islamic-calligraphy/mashaallah-la-quwwata/product.js"></script>
<script src="../products/wall-clocks/luxury-gold-black-roman-numeral/product.js"></script>

<script>
(function(){

const params = new URLSearchParams(window.location.search);
const productId = params.get("id");
const product = window.HOTANI_GET_PRODUCT(productId);
const container = document.getElementById("product-details");

if(!product){
container.innerHTML = `
<div class="error">
<h2>Product Not Found</h2>
<p>Sorry, this product is not available.</p>
<a href="../index.html">Back to Home</a>
</div>`;
return;
}

const basePrice = Number(product.offerPrice) > 0
? Number(product.offerPrice)
: Number(product.price);

let unit = "inch";
let quantity = 1;
let width = 12;
let height = 12;
let calculatedPrice = basePrice;

function money(value){
return "Rs. " + Math.round(value).toLocaleString("en-PK");
}

function sizeText(){
return unit === "inch"
? width + " × " + height + " inches"
: width + " × " + height + " feet";
}

container.innerHTML = `
<div class="product-layout">

<div class="product-image-box">
<img src="../${product.image}" alt="${product.name}">
</div>

<div class="product-info">

${product.badge ? `<span class="badge">${product.badge}</span>` : ""}

<h1>${product.name}</h1>

<div class="prices">
${Number(product.offerPrice)>0
? `<span class="old-price">${money(product.price)}</span>` : ""}
<span class="sale-price">${money(basePrice)}</span>
</div>

<p class="description">
Discover premium quality acrylic wall décor from HOTANI ACRYLIC STORE.
Choose your required custom size and get an automatic price calculation.
</p>

<div class="calculator">

<h3>Custom Size Calculator</h3>
<div class="calculator-note">
Base price: ${money(basePrice)} for 12 × 12 inches (1 × 1 feet).
Select your required size below.
</div>

<div class="unit-options">
<button type="button" id="inch-unit" class="active">Inches</button>
<button type="button" id="feet-unit">Feet</button>
</div>

<div class="size-fields">
<div>
<label for="width-input">Width (<span id="unit-width">inches</span>)</label>
<input id="width-input" type="number" min="12" step="0.5" value="12">
</div>

<div>
<label for="height-input">Height (<span id="unit-height">inches</span>)</label>
<input id="height-input" type="number" min="12" step="0.5" value="12">
</div>
</div>

<div class="minimum-note" id="minimum-note">
Minimum size: 12 × 12 inches
</div>

<div class="size-error" id="size-error">
Minimum size must be 12 × 12 inches or 1 × 1 feet.
</div>

<div class="price-summary">
<div class="price-row">
<span>Selected Size</span>
<strong id="selected-size">12 × 12 inches</strong>
</div>

<div class="price-row">
<span>Price per 12 × 12 inches</span>
<strong>${money(basePrice)}</strong>
</div>

<div class="price-row total-row">
<span>Your Size Price</span>
<strong id="calculated-price">${money(basePrice)}</strong>
</div>
</div>
</div>

<label class="quantity-label">Quantity</label>
<div class="quantity-control">
<button type="button" id="minus">−</button>
<span id="quantity">1</span>
<button type="button" id="plus">+</button>
</div>

<button class="action-button add-button" id="add-cart">
ADD TO CART
</button>

<button class="action-button buy-button" id="buy-now">
ORDER ON WHATSAPP
</button>

<div class="details-box">
<strong>Product Information</strong><br>
Product: ${product.name}<br>
Category: ${product.category}<br>
Store: HOTANI ACRYLIC STORE
</div>

</div>
</div>
`;

const widthInput = document.getElementById("width-input");
const heightInput = document.getElementById("height-input");
const errorBox = document.getElementById("size-error");

function updatePrice(){

width = Number(widthInput.value);
height = Number(heightInput.value);

const minimum = unit === "inch" ? 12 : 1;

if(!widthInput.value || !heightInput.value ||
width < minimum || height < minimum ||
!Number.isFinite(width) || !Number.isFinite(height)){

errorBox.style.display = "block";
document.getElementById("add-cart").disabled = true;
document.getElementById("buy-now").disabled = true;
document.getElementById("calculated-price").textContent = "Invalid Size";
return false;
}

errorBox.style.display = "none";
document.getElementById("add-cart").disabled = false;
document.getElementById("buy-now").disabled = false;

const widthInches = unit === "feet" ? width * 12 : width;
const heightInches = unit === "feet" ? height * 12 : height;

const area = widthInches * heightInches;
calculatedPrice = basePrice * (area / 144);

document.getElementById("selected-size").textContent = sizeText();
document.getElementById("calculated-price").textContent = money(calculatedPrice);

return true;
}

function changeUnit(newUnit){

unit = newUnit;

if(unit === "inch"){
widthInput.value = 12;
heightInput.value = 12;
widthInput.min = 12;
heightInput.min = 12;
widthInput.step = 0.5;
heightInput.step = 0.5;

document.getElementById("unit-width").textContent = "inches";
document.getElementById("unit-height").textContent = "inches";
document.getElementById("minimum-note").textContent = "Minimum size: 12 × 12 inches";
document.getElementById("inch-unit").classList.add("active");
document.getElementById("feet-unit").classList.remove("active");
}else{
widthInput.value = 1;
heightInput.value = 1;
widthInput.min = 1;
heightInput.min = 1;
widthInput.step = 0.1;
heightInput.step = 0.1;

document.getElementById("unit-width").textContent = "feet";
document.getElementById("unit-height").textContent = "feet";
document.getElementById("minimum-note").textContent = "Minimum size: 1 × 1 feet";
document.getElementById("feet-unit").classList.add("active");
document.getElementById("inch-unit").classList.remove("active");
}

updatePrice();
}

document.getElementById("inch-unit").addEventListener("click",()=>changeUnit("inch"));
document.getElementById("feet-unit").addEventListener("click",()=>changeUnit("feet"));
widthInput.addEventListener("input",updatePrice);
heightInput.addEventListener("input",updatePrice);

document.getElementById("minus").addEventListener("click",function(){
if(quantity>1) quantity--;
document.getElementById("quantity").textContent=quantity;
});

document.getElementById("plus").addEventListener("click",function(){
quantity++;
document.getElementById("quantity").textContent=quantity;
});

document.getElementById("add-cart").addEventListener("click",function(){

if(!updatePrice()) return;

let cart=[];
try{
cart=JSON.parse(localStorage.getItem("hotani_cart"))||[];
}catch(e){cart=[];}

const customName = product.name + " (" + sizeText() + ")";
const cartId = product.id + "-" + unit + "-" + width + "x" + height;

const existing=cart.find(item=>item.id===cartId);

if(existing){
existing.quantity+=quantity;
}else{
cart.push({
id:cartId,
productId:product.id,
name:customName,
price:Math.round(calculatedPrice),
image:product.image,
quantity:quantity,
customSize:sizeText()
});
}

localStorage.setItem("hotani_cart",JSON.stringify(cart));
alert("Product added to your cart!");
});

document.getElementById("buy-now").addEventListener("click",function(){

if(!updatePrice()) return;

const total=Math.round(calculatedPrice)*quantity;

const message=
"Assalam o Alaikum! I want to order:\n\n"+
"Product: "+product.name+"\n"+
"Custom Size: "+sizeText()+"\n"+
"Quantity: "+quantity+"\n"+
"Unit Price: "+money(calculatedPrice)+"\n"+
"Total Price: "+money(total);

window.open(
"https://wa.me/923336461771?text="+encodeURIComponent(message),
"_blank"
);

});

updatePrice();

})();
</script>

</body>
</html>
