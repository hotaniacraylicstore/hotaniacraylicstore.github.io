
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Islamic Calligraphy | HOTANI ACRYLIC STORE</title>
<link rel="stylesheet" href="../style.css">

<style>
.category-page{
max-width:1250px;
margin:40px auto;
padding:20px;
}
.category-heading{
text-align:center;
margin-bottom:35px;
}
.category-heading h1{
font-size:32px;
margin-bottom:10px;
}
.category-heading p{
color:#777;
}
.product-grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
gap:25px;
}
.product-card{
position:relative;
border:1px solid #eee;
border-radius:10px;
overflow:hidden;
background:#fff;
transition:.3s;
}
.product-card:hover{
transform:translateY(-5px);
box-shadow:0 8px 25px rgba(0,0,0,.08);
}
.product-image-link{
display:block;
background:#f7f7f7;
}
.product-card img{
width:100%;
aspect-ratio:1/1;
object-fit:cover;
display:block;
}
.product-card-content{
padding:17px;
}
.product-name{
color:#222;
text-decoration:none;
}
.product-name h3{
font-size:17px;
margin:0 0 12px;
}
.product-price{
margin-bottom:15px;
}
.old-price{
color:#999;
text-decoration:line-through;
margin-right:8px;
}
.sale-price{
font-weight:bold;
font-size:19px;
}
.view-details{
display:block;
text-align:center;
background:#222;
color:white;
padding:12px;
border-radius:5px;
text-decoration:none;
font-size:14px;
}
.sale-badge{
position:absolute;
top:12px;
left:12px;
background:#222;
color:#fff;
padding:7px 10px;
font-size:12px;
z-index:2;
}
.empty-message{
grid-column:1/-1;
text-align:center;
padding:50px 10px;
color:#777;
}
.site-header{
padding:20px 4%;
border-bottom:1px solid #eee;
display:flex;
justify-content:space-between;
align-items:center;
gap:15px;
}
.site-header a{
color:#222;
text-decoration:none;
}
.site-brand{
font-size:21px;
font-weight:bold;
}
.breadcrumb{
padding:15px 4%;
background:#f7f7f7;
font-size:14px;
}
.breadcrumb a{
color:#333;
text-decoration:none;
}
.site-footer{
background:#222;
color:white;
padding:25px;
text-align:center;
margin-top:50px;
}
@media(max-width:600px){
.category-heading h1{font-size:25px}
.product-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.product-card-content{padding:12px}
.product-name h3{font-size:14px}
.sale-price{font-size:16px}
}
</style>
</head>

<body>

<div id="announcement-bar">
Welcome to HOTANI ACRYLIC STORE
</div>

<header class="site-header">
<a href="../index.html" class="site-brand">HOTANI ACRYLIC STORE</a>
<a href="../index.html">← Home</a>
</header>

<div class="breadcrumb">
<a href="../index.html">Home</a> / Islamic Calligraphy
</div>

<main class="category-page">

<div class="category-heading">
<h1>Islamic Calligraphy</h1>
<p>Beautiful Islamic acrylic wall art for your home</p>
</div>

<div id="category-products" class="product-grid">
<p class="empty-message">Loading products...</p>
</div>

</main>

<footer class="site-footer">
© 2026 HOTANI ACRYLIC STORE. All Rights Reserved.
</footer>

<script src="../data/products.js"></script>

<script src="../products/islamic-calligraphy/gold-acrylic-bismillah/product.js"></script>
<script src="../products/islamic-calligraphy/round-ayatul-kursi/product.js"></script>
<script src="../products/islamic-calligraphy/mashaallah-gold-acrylic/product.js"></script>
<script src="../products/islamic-calligraphy/mashaallah-la-quwwata/product.js"></script>

<script>
(function(){

const container=document.getElementById("category-products");

const products=window.HOTANI_GET_PRODUCTS_BY_CATEGORY("islamic-calligraphy");

function money(price){
return "Rs. "+Number(price).toLocaleString("en-PK");
}

if(!products || products.length===0){

container.innerHTML=`
<p class="empty-message">New products coming soon.</p>
`;

return;
}

container.innerHTML=products.map(product=>{

const price=Number(product.offerPrice)>0
? Number(product.offerPrice)
: Number(product.price);

const detailLink="product-details.html?id="+encodeURIComponent(product.id);

return `
<div class="product-card">

${product.badge
? `<span class="sale-badge">${product.badge}</span>`
: ""}

<a class="product-image-link" href="${detailLink}">
<img src="../${product.image}" alt="${product.name}" loading="lazy">
</a>

<div class="product-card-content">

<a class="product-name" href="${detailLink}">
<h3>${product.name}</h3>
</a>

<div class="product-price">
${Number(product.offerPrice)>0
? `<span class="old-price">${money(product.price)}</span>`
: ""}
<span class="sale-price">${money(price)}</span>
</div>

<a class="view-details" href="${detailLink}">
VIEW DETAILS
</a>

</div>
</div>
`;

}).join("");

})();
</script>

</body>
</html>
