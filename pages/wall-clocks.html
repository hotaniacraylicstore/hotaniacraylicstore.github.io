
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wall Clocks | HOTANI ACRYLIC STORE</title>
    <link rel="stylesheet" href="../style.css">

    <style>
        .category-page {
            max-width: 1200px;
            margin: 40px auto;
            padding: 20px;
        }

        .category-heading {
            text-align: center;
            margin-bottom: 35px;
        }

        .category-heading h1 {
            font-size: 34px;
            margin-bottom: 12px;
        }

        .category-heading p {
            color: #777;
        }

        .category-products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 25px;
        }

        .category-product {
            border: 1px solid #eee;
            border-radius: 10px;
            overflow: hidden;
            background: #fff;
        }

        .category-product img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
        }

        .category-product-info {
            padding: 18px;
        }

        .category-product-info h3 {
            margin-bottom: 10px;
        }

        .category-price {
            font-weight: bold;
            margin-bottom: 12px;
        }

        .category-product-info a {
            display: inline-block;
            padding: 10px 18px;
            background: #111;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
        }

        .empty-message {
            text-align: center;
            padding: 40px 10px;
            color: #777;
            grid-column: 1 / -1;
        }
    </style>
</head>

<body>

    <main class="category-page">

        <div class="category-heading">
            <h1>Wall Clocks</h1>
            <p>Explore our stylish wall clock collection.</p>
        </div>

        <div class="category-products" id="wall-clock-products">
            <p class="empty-message">Loading products...</p>
        </div>

    </main>

    <script src="../data/products.js"></script>

    <script>
        const container = document.getElementById("wall-clock-products");

        const products = window.HOTANI_GET_PRODUCTS_BY_CATEGORY("wall-clocks");

        if (!products || products.length === 0) {

            container.innerHTML = `
                <p class="empty-message">
                    New wall clocks are coming soon!
                </p>
            `;

        } else {

            container.innerHTML = products.map(product => {

                const price = Number(product.offerPrice) > 0
                    ? product.offerPrice
                    : product.price;

                return `
                    <div class="category-product">

                        <img
                            src="../${product.image}"
                            alt="${product.name}"
                            loading="lazy"
                        >

                        <div class="category-product-info">

                            <h3>${product.name}</h3>

                            <p class="category-price">
                                Rs. ${Number(price).toLocaleString("en-PK")}
                            </p>

                            <a href="product.html?id=${encodeURIComponent(product.id)}">
                                View Details
                            </a>

                        </div>

                    </div>
                `;

            }).join("");

        }
    </script>

</body>
</html>
