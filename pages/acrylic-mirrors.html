
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acrylic Mirrors | HOTANI ACRYLIC STORE</title>
<link rel="stylesheet" href="../style.css">

<style>
.category-page{max-width:1200px;margin:40px auto;padding:20px}
.category-heading{text-align:center;margin-bottom:35px}
.category-heading h1{font-size:34px;margin-bottom:12px}
.category-heading p{color:#777}
.category-products{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:25px}
.category-product{border:1px solid #eee;border-radius:10px;overflow:hidden;background:#fff;transition:.3s}
.category-product:hover{transform:translateY(-5px);box-shadow:0 8px 25px rgba(0,0,0,.10)}
.product-image{display:block}
.category-product img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}
.category-product-info{padding:18px}
.category-product-info h3{margin-bottom:10px}
.category-price{font-weight:bold;margin-bottom:12px}
.view-details{display:inline-block;padding:10px 18px;background:#111;color:#fff;text-decoration:none;border-radius:5px}
.empty-message{text-align:center;padding:45px 10px;color:#777;grid-column:1/-1}
</style>
</head>

<body>

<div id="announcement-bar">Welcome to HOTANI ACRYLIC STORE</div>

<header style="padding:20px 4%;border-bottom:1px solid #eee;">
<a href="../index.html" style="font-size:22px;font-weight:bold;">HOTANI ACRYLIC STORE</a>
<a href="../index.html" style="float:right;">Home</a>
</header>

<nav style="padding:15px 4%;background:#f7f7f7;">
<a href="../index.html">Home</a> / Acrylic Mirrors
</nav>

<main class="category-page">

<div class="category-heading">
<h1>Acrylic Mirrors</h1>
<p>Discover beautiful acrylic mirror designs for your home.</p>
</div>

<div id="category-products" class="category-products">
<p class="empty-message">Loading products...</p>
</div>

</main>

<footer style="background:#222;color:white;padding:25px;text-align:center;">
© 2026 HOTANI ACRYLIC STORE. All Rights Reserved.
</footer>

<script src="../data/products.js"></script>

<script>
const container=document.getElementById("category-products");

const products=window.HOTANI_GET_PRODUCTS_BY_CATEGORY
? window.HOTANI_GET_PRODUCTS_BY_CATEGORY("acrylic-mirrors")
: [];

if(!products || products.length===0){

container.innerHTML=`
<p class="empty-message">New Acrylic Mirror products coming soon.</p>
`;

}else{

container.innerHTML=products.map(product=>{

const price=Number(product.offerPrice)>0
? product.offerPrice
: product.price;

const detailLink="product-details.html?id="+encodeURIComponent(product.id);

return `
<div class="category-product">

<a class="product-image" href="${detailLink}">
<img src="../${product.image}" alt="${product.name}" loading="lazy">
</a>

<div class="category-product-info">
<h3>${product.name}</h3>

<p class="category-price">
Rs. ${Number(price).toLocaleString("en-PK")}
</p>

<a class="view-details" href="${detailLink}">View Details</a>
</div>

</div>
`;

}).join("");

}
</script>

</body>
</html>
